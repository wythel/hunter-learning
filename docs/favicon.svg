<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 寶貝球。刻意只用四個形狀:紅上半、白下半、黑腰帶、白按鈕,
       讓它在 16x16 的分頁上仍然認得出來——細節在那個尺寸只會糊掉。 -->
  <circle cx="32" cy="32" r="30" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="4"/>
  <path d="M2 32a30 30 0 0 1 60 0z" fill="#DC0A2D"/>
  <path d="M2 32h60" stroke="#1A1A1A" stroke-width="7"/>
  <circle cx="32" cy="32" r="10" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="5"/>
  <circle cx="32" cy="32" r="4" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="2"/>
</svg>
